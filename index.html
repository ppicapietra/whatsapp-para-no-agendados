  <h2>Abrir chat de Whatsapp con n&uacute;mero no agendado</h2>
  <form role="main" onsubmit="return validate()">
    <div class="attach-row">
      <label class="attachButton" for="fileInput">
        <i class="fas fa-paperclip" aria-hidden="true"></i>
        <span id="attachLabelText">Adjuntar archivo</span>
      </label>
      <p class="attach-hint">Imagen, video o PDF · máx. 50 MB</p>
      <input class="file-input" type="file" id="fileInput"
        accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf,.jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mov,.pdf" />
    </div>
    <div id="filePreview" class="file-preview" hidden>
      <button type="button" class="clear-file" id="clearFile" aria-label="Quitar archivo">&times;</button>
      <div id="filePreviewMedia"></div>
      <p class="file-name" id="filePreviewName"></p>
      <p class="file-size" id="filePreviewSize"></p>
      <p class="file-status" id="filePreviewStatus"></p>
    </div>
    <input type="tel" placeholder="n&uacute;mero de tel&eacute;fono" name="cellphone" id="cellphone" />
    <!--<textarea placeholder="Mensaje (opcional)" name="message" id="message" maxlength="500"
      style="display:none"></textarea>-->
    <a class="buttonLink" role="button" href="javascript:void(0)" id="send" onclick="return validate()">ABRIR CHAT<i class="fab fa-whatsapp btn-icon"></i></a>
  </form>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div class="ads-container">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9555847366762808"
       crossorigin="anonymous"></script>
  <!-- tool-apps -->
  <ins class="adsbygoogle"
       style="display:block; width:320px; height:50px;"
       data-ad-client="ca-pub-9555847366762808"
       data-ad-slot="5691844179"
       data-ad-format="horizontal"
       data-full-width-responsive="false"></ins>
  <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
  </div>

  <footer>
    <p>Creado por&nbsp;<a class="link" href="https://github.com/ppicapietra">@ppicapietra</a></p>
    <p id="appVersion"></p>
    <a class="installButton" id="installButton">Instalar app</a>
  </footer>

  <script>
    const versionNumber = "1.7.1";
    const MAX_FILE_BYTES = 50 * 1024 * 1024;
    const ALLOWED_MIME_TYPES = {
      'image/jpeg': 'image',
      'image/png': 'image',
      'image/webp': 'image',
      'image/gif': 'image',
      'video/mp4': 'video',
      'video/webm': 'video',
      'video/quicktime': 'video',
      'application/pdf': 'pdf'
    };
    const MIME_BY_EXTENSION = {
      jpg: 'image/jpeg',
      jpeg: 'image/jpeg',
      png: 'image/png',
      webp: 'image/webp',
      gif: 'image/gif',
      mp4: 'video/mp4',
      webm: 'video/webm',
      mov: 'video/quicktime',
      pdf: 'application/pdf'
    };
    let eInstall = null;
    let messageBodyText = "";
    let captionText = "";
    let attachedFile = null;
    let signedFileUrl = "";
    let uploadToken = 0;
    let previewObjectUrl = "";
    let toastTimer = 0;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.hidden = true;
      }, 4000);
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function resolveMime(file) {
      let type = (file.type || '').toLowerCase();
      if (type === 'image/jpg') type = 'image/jpeg';
      if (ALLOWED_MIME_TYPES[type]) return type;
      const extension = ((file.name || '').split('.').pop() || '').toLowerCase();
      return MIME_BY_EXTENSION[extension] || '';
    }

    function currentOutboundMessage() {
      if (signedFileUrl) {
        const caption = captionText.trim();
        return caption ? `${caption}\n\n${signedFileUrl}` : signedFileUrl;
      }
      return messageBodyText;
    }

    function updateSendState() {
      const send = document.getElementById('send');
      const blocked = Boolean(attachedFile) && !signedFileUrl;
      send.classList.toggle('is-disabled', blocked);
      send.setAttribute('aria-disabled', blocked ? 'true' : 'false');
    }

    function updateAttachLabel() {
      document.getElementById('attachLabelText').textContent = attachedFile
        ? 'Cambiar archivo'
        : 'Adjuntar archivo';
    }

    function setUploadStatus(text) {
      document.getElementById('filePreviewStatus').textContent = text;
    }

    function revokePreview() {
      if (!previewObjectUrl) return;
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = '';
    }

    function renderPreview(file, mime) {
      revokePreview();
      const media = document.getElementById('filePreviewMedia');
      media.replaceChildren();
      const kind = ALLOWED_MIME_TYPES[mime];
      if (kind === 'image' || kind === 'video') {
        previewObjectUrl = URL.createObjectURL(file);
        const element = document.createElement(kind === 'image' ? 'img' : 'video');
        element.src = previewObjectUrl;
        if (kind === 'image') {
          element.alt = file.name || 'Imagen adjunta';
        } else {
          element.muted = true;
          element.playsInline = true;
          element.preload = 'metadata';
          element.addEventListener('loadeddata', () => {
            if (element.duration > 0.1) {
              element.currentTime = Math.min(0.1, element.duration / 2);
            }
          });
        }
        media.appendChild(element);
      } else {
        const icon = document.createElement('i');
        icon.className = 'fas fa-file-pdf preview-icon';
        icon.setAttribute('aria-hidden', 'true');
        media.appendChild(icon);
      }
      document.getElementById('filePreviewName').textContent = file.name || 'archivo';
      document.getElementById('filePreviewSize').textContent = formatFileSize(file.size);
      document.getElementById('filePreview').hidden = false;
    }

    function clearAttachment() {
      uploadToken += 1;
      attachedFile = null;
      signedFileUrl = '';
      revokePreview();
      document.getElementById('filePreview').hidden = true;
      document.getElementById('filePreviewMedia').replaceChildren();
      document.getElementById('fileInput').value = '';
      updateAttachLabel();
      updateSendState();
    }

    function shareCacheUrls() {
      const scope = new URL('./', window.location.href);
      return {
        file: new URL('shared-file', scope).href,
        meta: new URL('shared-file-meta', scope).href
      };
    }

    async function acceptFile(file, extraCount) {
      const mime = resolveMime(file);
      if (!mime || !ALLOWED_MIME_TYPES[mime]) {
        showToast('Solo se pueden enviar imágenes, videos o PDF.');
        return;
      }
      if (!file.size) {
        showToast('El archivo está vacío.');
        return;
      }
      if (file.size > MAX_FILE_BYTES) {
        showToast('El archivo supera el límite de 50 MB.');
        return;
      }

      const uploadFile = file.type === mime
        ? file
        : new File([file], file.name || 'archivo', { type: mime });

      if (!captionText && messageBodyText) captionText = messageBodyText;

      uploadToken += 1;
      const token = uploadToken;
      attachedFile = uploadFile;
      signedFileUrl = '';
      renderPreview(uploadFile, mime);
      updateAttachLabel();
      updateSendState();
      setUploadStatus('Subiendo… 0 %');

      if (extraCount > 0) {
        showToast('Solo se puede enviar un archivo. El resto se ignoró.');
      }

      try {
        const url = await StorageClient.uploadAndSign(uploadFile, (percent) => {
          if (token !== uploadToken) return;
          setUploadStatus(percent >= 100 ? 'Preparando enlace…' : `Subiendo… ${percent} %`);
        });
        if (token !== uploadToken) return;
        signedFileUrl = url;
        setUploadStatus('Listo');
        updateSendState();
      } catch (err) {
        if (token !== uploadToken) return;
        Utils.debugLog(err);
        signedFileUrl = '';
        setUploadStatus('No se pudo subir');
        updateSendState();
        showToast('No se pudo subir el archivo. Intentá de nuevo.');
      }
    }

    async function loadSharedFile() {
      try {
        const cache = await caches.open('wanoa-shared-file');
        const urls = shareCacheUrls();
        const fileResponse = await cache.match(urls.file);
        const metaResponse = await cache.match(urls.meta);
        if (!fileResponse || !metaResponse) {
          showToast('No se pudo leer el archivo compartido.');
          return;
        }
        const meta = await metaResponse.json();
        const blob = await fileResponse.blob();
        await cache.delete(urls.file);
        await cache.delete(urls.meta);
        const file = new File([blob], meta.name || 'archivo', {
          type: meta.type || blob.type || ''
        });
        acceptFile(file, Number(meta.extraCount) || 0);
      } catch (err) {
        Utils.debugLog(err);
        showToast('No se pudo leer el archivo compartido.');
      }
    }

    window.validate = () => {
      event.preventDefault();

      if (attachedFile && !signedFileUrl) return false;

      const cf = document.getElementById("cellphone");
      const cellphoneNumber = Utils.formatCellphoneNumber(cf.value);

      if (!Utils.validateCellphoneNumber(cellphoneNumber)) {
        alert("El número de celular tiene un formato incorrecto");
        return false;
      }
      else {
        const url = Utils.getLink(cellphoneNumber, currentOutboundMessage());
        Utils.openChat(url);
      }
    }
    /** Set focus on cellphone input at beggining*/
    document.addEventListener("DOMContentLoaded", () => {

      try {
        const params = (new URL(document.location)).searchParams;
        Utils.debugLog(params);

        const sharedFile = params.get('sharedFile') === '1';
        const fileError = params.get('fileError');
        if (fileError === 'size') {
          showToast('El archivo supera el límite de 50 MB.');
        } else if (fileError) {
          showToast('No se pudo leer el archivo compartido.');
        }

        // phone number param
        const nParam = params.get('text');
        if (sharedFile) {
          const cellphoneNumber = Utils.formatCellphoneNumber(nParam || '');
          if (nParam && Utils.validateCellphoneNumber(cellphoneNumber)) {
            document.getElementById('cellphone').value = cellphoneNumber;
          } else if (nParam) {
            captionText = nParam;
            messageBodyText = nParam;
          } else if (params.get('title')) {
            captionText = params.get('title');
            messageBodyText = params.get('title');
          }
          loadSharedFile();
        } else if (nParam) {
          const cellphoneNumber = Utils.formatCellphoneNumber(nParam);

          if (Utils.validateCellphoneNumber(cellphoneNumber)) {
            const url = Utils.getLink(cellphoneNumber);
            Utils.openChat(url);
          }
          else { //wrong format number
            // alert("El número de celular tiene un formato incorrecto");
            messageBodyText = nParam;
          }
        }
      } catch (err) { 
        Utils.debugLog(err);
       }

      try {

            document.getElementById('appVersion').textContent = `v${versionNumber}`;
      }
      catch (err) { 
        Utils.debugLog(err);
      }

      document.querySelector("#installButton").addEventListener("click",e => {
        eInstall.prompt();
      });

      const cf = document.getElementById("cellphone");
      cf.focus();

      document.getElementById('clearFile').addEventListener('click', clearAttachment);
      document.getElementById('fileInput').addEventListener('change', (changeEvent) => {
        const files = Array.from(changeEvent.target.files || []);
        changeEvent.target.value = '';
        if (!files.length) return;
        acceptFile(files[0], files.length - 1);
      });
      updateSendState();
    });
   

    window.addEventListener('beforeinstallprompt', evt => {
      Utils.debugLog(evt.platforms);
      evt.preventDefault();
      eInstall = evt;
      document.querySelector('#installButton').style.display = 'inline-block';
    });
    window.addEventListener('appinstalled', evt => {
      document.querySelector('#installButton').style.display = 'none';
    });
  </script>
  <script src="./main.js"></script>
</body>
